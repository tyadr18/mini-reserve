ja:
  activerecord:
    models:
      reservation: 予約
    attributes:
      reservation:
        customer_name: お客様名
        contact: 連絡先
        reserved_on: 予約日
        time_slot: 時間枠
        party_size: 人数
        note: 備考
    errors:
      models:
        reservation:
          attributes:
            reserved_on:
              in_the_past: "は現在より後の日時を指定してください"
            party_size:
              over_capacity: "が定員を超えています（この時間枠の残りは%{remaining}名です）"
            contact:
              invalid: "はメールアドレスか電話番号（例: 090-1234-5678）で入力してください"

  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: を入力してください
      inclusion: は一覧から選んでください
      invalid: が正しくありません
      too_long: は%{count}文字以内で入力してください
      not_a_number: は数値で入力してください
      not_an_integer: は整数で入力してください
      greater_than_or_equal_to: は%{count}以上にしてください
      less_than_or_equal_to: は%{count}以下にしてください

  date:
    formats:
      default: "%Y/%m/%d"
      short: "%-m/%-d"
      long: "%Y年%-m月%-d日（%a）"
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order:
      - :year
      - :month
      - :day

  time:
    formats:
      default: "%Y/%m/%d %H:%M"
    am: 午前
    pm: 午後
